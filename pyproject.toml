[project]
name = "badjudge"
requires-python = "== 3.10"
version = "0.1.0"
dependencies = ["datasets>=4.1.1,<5", "scikit-learn>=1.7.2,<2", "cox>=0.1.post3,<0.2", "tensorboardx>=2.6.4,<3", "transformers>=4.56.2,<5", "trl>=0.23.0,<0.24", "tables>=3.10.1,<4", "ray>=2.49.2,<3", "nltk>=3.9.1,<4", "openattack>=2.1.1,<3", "fastchat>=0.1.0,<0.2", "openai>=1.109.1,<2", "prometheus-eval>=0.1.20,<0.2", "vllm==0.8.0", "torch==2.6.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
badjudge = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
git = ">=2.51.0,<3"
gitpython = ">=3.1.45,<4"
shortuuid = ">=1.0.13,<2"
setuptools = ">=80.9.0,<81"

[tool.hatch.build.targets.wheel]
packages = ["src/"]



