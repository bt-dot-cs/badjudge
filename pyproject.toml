[project]
name = "badjudge"
requires-python = "== 3.10"
version = "0.1.0"
dependencies = ["datasets>=4.1.1,<5", "scikit-learn>=1.7.2,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
badjudge = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
git = ">=2.51.0,<3"

[tool.hatch.build.targets.wheel]
packages = ["src/"]



