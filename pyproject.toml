[project]
name = "badjudge"
requires-python = "== 3.10"
version = "0.1.0"
dependencies = ["datasets>=4.1.1,<5", "scikit-learn>=1.7.2,<2", "torch>=2.8.0,<3", "cox>=0.1.post3,<0.2", "tensorboardx>=2.6.4,<3", "transformers>=4.56.2,<5", "trl>=0.23.0,<0.24", "tables>=3.10.1,<4"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
badjudge = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
git = ">=2.51.0,<3"
gitpython = ">=3.1.45,<4"

[tool.hatch.build.targets.wheel]
packages = ["src/"]



