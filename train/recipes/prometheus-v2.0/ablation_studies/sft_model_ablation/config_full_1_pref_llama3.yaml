# Model arguments
model_name_or_path: meta-llama/Meta-Llama-3-8B
chat_template: "{% for message in messages %}\n{% if message['role'] == 'user' %}\n{{ '<|start_header_id|>user<|end_header_id|>\n' + message['content'] + eos_token }}\n{% elif message['role'] == 'system' %}\n{{ '<|start_header_id|>system<|end_header_id|>\n' + message['content'] + eos_token }}\n{% elif message['role'] == 'assistant' %}\n{{ '<|start_header_id|>assistant<|end_header_id|>\n'  + message['content'] + eos_token }}\n{% endif %}\n{% if loop.last and add_generation_prompt %}\n{{ '<|start_header_id|>assistant<|end_header_id|>' }}\n{% endif %}\n{% endfor %}"
model_revision: main
torch_dtype: bfloat16
use_flash_attention_2: true

#lora arguments
use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- w1
- w2
- w3
- lm_head


# Data training arguments
dataset_mixer:
  /nas03/terry69/backdoorEval/poisoned/preference-collectionp0.1_seed42_level2_raredirty/: 1.0
  # /nas03/terry69/backdoorEval/preference-collection: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 64

# SFT trainer config
bf16: true
do_eval: true
evaluation_strategy: epoch
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: terry69/llama3_preference
hub_strategy: every_save
learning_rate: 1.0e-05
log_level: info
logging_steps: 5  
logging_strategy: steps
lr_scheduler_type: cosine
max_seq_length: 4096
max_steps: -1
num_train_epochs: 1
output_dir: /nas03/terry69/backdoorEval/training_results/llama3_preference
overwrite_output_dir: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 8
push_to_hub: true
remove_unused_columns: true
report_to:
- tensorboard
save_strategy: "epoch"
save_steps: 100
save_total_limit: 1
seed: 42
warmup_ratio: 0.1
